name: Feature request
description: Suggest an improvement or something new to model.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to make, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Sketches, reference photos and example prompts are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you've tried, or how other tools handle it.
