# Checked by `cargo deny` in CI. See "Permissive dependencies only" in CONTRIBUTING.md.
# The npm side is checked by test/licenses.mjs.
[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[licenses]
# Permissive licenses only.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# MPL-2.0 crates that Tauri brings in. We use them unchanged, which MPL-2.0
# allows without conditions on our own code. Each is named, so a new one fails.
exceptions = [
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
  { allow = ["MPL-2.0"], crate = "option-ext" },
  { allow = ["MPL-2.0"], crate = "selectors" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# A crate deep in Tauri that nobody maintains any more is not ours to replace,
# so only our own direct dependencies fail for that. Known vulnerabilities fail
# wherever they are.
unmaintained = "workspace"
