<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Maker</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="viewport"></div>

    <header class="top">
      <div id="heading">
        <span id="title">3D Maker</span>
        <span id="facts"></span>
      </div>
      <nav>
        <button data-action="new" title="New model">New</button>
        <button data-action="open" title="Open (⌘O)">Open</button>
        <button data-action="save" title="Save (⌘S)">Save</button>
        <div class="menu">
          <button id="export-button" type="button" title="Export a picture or a file for other apps (⌘E exports an STL)" aria-haspopup="menu" aria-expanded="false">Export</button>
          <div id="export-menu" role="menu" hidden>
            <button type="button" role="menuitem" data-export="png"><span>Picture</span><small>This view as a studio shot, PNG</small></button>
            <button type="button" role="menuitem" data-export="stl"><span>STL</span><small>Each part a closed shell</small></button>
            <button type="button" role="menuitem" data-export="solid"><span>STL, one solid</span><small>All parts joined, to print in one piece</small></button>
            <button type="button" role="menuitem" data-export="3mf"><span>3MF</span><small>Named, coloured parts</small></button>
          </div>
        </div>
      </nav>
    </header>

    <section id="card" hidden>
      <div class="card-head">
        <span id="card-name"></span>
        <button id="card-close" type="button" aria-label="Deselect" title="Deselect (Esc)">×</button>
      </div>
      <div id="card-params"></div>
      <p id="card-hint">Type below to change this part.</p>
    </section>

    <div id="views" hidden>
      <button type="button" data-view="fit" title="Fit the model in the view (F)">Fit</button>
      <span class="rule"></span>
      <button type="button" data-view="iso" title="Look from a corner">Corner</button>
      <button type="button" data-view="top" title="Look from above">Top</button>
      <button type="button" data-view="front" title="Look from the front">Front</button>
      <button type="button" data-view="right" title="Look from the side">Side</button>
      <span class="rule" id="play-rule" hidden></span>
      <button id="play" type="button" hidden>Pause</button>
    </div>

    <div id="dock">
      <div id="start" hidden>
        <h1>What do you want to make?</h1>
        <p>Describe it, and Claude draws it in 3D. Or start from one of these.</p>
        <div id="ideas">
          <button type="button">A desk lamp with a weighted base</button>
          <button type="button">A helicopter whose rotors spin</button>
          <button type="button">A planetary gearbox that turns</button>
        </div>
      </div>
      <div id="reply" hidden>
        <button id="reply-close" type="button" aria-label="Close" title="Close">×</button>
        <p id="reply-prompt"></p>
        <p id="reply-text"></p>
        <p id="reply-receipt" hidden></p>
      </div>
      <div id="progress" hidden>
        <div id="progress-text"></div>
        <div id="progress-bar"><span></span></div>
      </div>
      <form id="prompt" autocomplete="off">
        <span id="chip" hidden><span id="chip-name"></span><button type="button" id="chip-clear" aria-label="Deselect">×</button></span>
        <textarea id="input" rows="1" placeholder="Describe what to make" aria-label="Prompt"></textarea>
        <button id="send" type="submit">Make</button>
      </form>
      <div id="status" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
