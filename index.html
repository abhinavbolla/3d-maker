<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draftsman</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="viewport"></div>

    <header class="top">
      <div id="heading">
        <span id="title">Draftsman</span>
        <span id="facts"></span>
      </div>
      <nav>
        <button data-action="new" title="New model">New</button>
        <button data-action="open" title="Open (⌘O)">Open</button>
        <button data-action="save" title="Save (⌘S)">Save</button>
        <div class="menu">
          <button id="export-button" type="button" title="Export a picture, a drawing or a file for other apps (⌘E exports an STL)" aria-haspopup="menu" aria-expanded="false">Export</button>
          <!-- What people want first; the file format one step in, in place. -->
          <div id="export-menu" role="menu" aria-label="Export" hidden>
            <div class="level" data-level="top">
              <button type="button" role="menuitem" data-group="print" aria-haspopup="true"><span>3D print</span><small>STL or 3MF</small></button>
              <button type="button" role="menuitem" data-group="drawing" aria-haspopup="true"><span>Drawing</span><small>Views, a section and sizes on a sheet</small></button>
              <button type="button" role="menuitem" data-group="plan" aria-haspopup="true"><span>Floor plan</span><small>Rooms, areas and sizes on a sheet</small></button>
              <button type="button" role="menuitem" data-group="apps" aria-haspopup="true"><span>CAD and 3D apps</span><small>STEP, glTF, OBJ or PLY</small></button>
              <div class="rule" role="separator"></div>
              <button type="button" role="menuitem" data-export="png"><span>Picture</span><small>This view as a studio shot, PNG</small></button>
              <button type="button" role="menuitem" data-export="video"><span>Video</span><small>One turn round the model, MP4</small></button>
              <button type="button" role="menuitem" data-export="html"><span>Web page</span><small>One file to turn in any browser</small></button>
            </div>
            <div class="level" data-level="print" role="group" aria-label="3D print" hidden>
              <button type="button" role="menuitem" class="back"><span>3D print</span></button>
              <button type="button" role="menuitem" data-export="stl"><span>STL</span><small>Each part a closed shell</small></button>
              <button type="button" role="menuitem" data-export="solid"><span>STL, one solid</span><small>All parts joined, to print in one piece</small></button>
              <button type="button" role="menuitem" data-export="3mf"><span>3MF</span><small>Named, coloured parts, for slicers</small></button>
            </div>
            <div class="level" data-level="drawing" role="group" aria-label="Drawing" hidden>
              <button type="button" role="menuitem" class="back"><span>Drawing</span></button>
              <button type="button" role="menuitem" data-export="pdf"><span>PDF</span><small>The A3 sheet, to print or send</small></button>
              <button type="button" role="menuitem" data-export="svg"><span>SVG</span><small>The same sheet, to open in a browser</small></button>
              <button type="button" role="menuitem" data-export="dxf"><span>DXF</span><small>The same sheet, for 2D CAD</small></button>
              <button type="button" role="menuitem" data-export="outline"><span>Outline, DXF</span><small>A section at true size, for a laser cutter</small></button>
            </div>
            <div class="level" data-level="plan" role="group" aria-label="Floor plan" hidden>
              <button type="button" role="menuitem" class="back"><span>Floor plan</span></button>
              <button type="button" role="menuitem" data-export="plan-pdf"><span>PDF</span><small>The plan, to print or send</small></button>
              <button type="button" role="menuitem" data-export="plan"><span>SVG</span><small>The same plan, to open in a browser</small></button>
              <button type="button" role="menuitem" data-export="plan-dxf"><span>DXF</span><small>The same plan, for 2D CAD</small></button>
            </div>
            <div class="level" data-level="apps" role="group" aria-label="CAD and 3D apps" hidden>
              <button type="button" role="menuitem" class="back"><span>CAD and 3D apps</span></button>
              <button type="button" role="menuitem" data-export="step"><span>STEP</span><small>Solids for FreeCAD, Fusion and other CAD</small></button>
              <button type="button" role="menuitem" data-export="glb"><span>glTF</span><small>Parts, materials and motion, for Blender</small></button>
              <button type="button" role="menuitem" data-export="obj"><span>OBJ</span><small>One object per part, with an MTL</small></button>
              <button type="button" role="menuitem" data-export="ply"><span>PLY</span><small>One mesh, coloured by part</small></button>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <section id="card" hidden>
      <div class="card-head">
        <span id="card-name"></span>
        <button id="card-close" type="button" aria-label="Deselect" title="Deselect (Esc)">×</button>
      </div>
      <div id="card-params"></div>
      <p id="card-hint">Type below to change this part.</p>
    </section>

    <div id="views" hidden>
      <button type="button" data-view="fit" title="Fit the model in the view, seen from a corner (F)">Fit</button>
      <span class="rule" id="play-rule" hidden></span>
      <button id="play" type="button" hidden>Pause</button>
    </div>

    <div id="viewcube" hidden></div>

    <div id="dock">
      <div id="start" hidden>
        <h1>What do you want to make?</h1>
        <p>Describe it, and Claude draws it in 3D. Or open an example and change it.</p>
        <div id="ideas"></div>
      </div>
      <div id="reply" hidden>
        <button id="reply-close" type="button" aria-label="Close" title="Close">×</button>
        <p id="reply-prompt"></p>
        <p id="reply-text"></p>
        <p id="reply-receipt" hidden></p>
      </div>
      <div id="progress" hidden>
        <div id="progress-text"></div>
        <div id="progress-bar"><span></span></div>
      </div>
      <form id="prompt" autocomplete="off">
        <span id="chip" hidden><span id="chip-name"></span><button type="button" id="chip-clear" aria-label="Deselect">×</button></span>
        <textarea id="input" rows="1" placeholder="Describe what to make" aria-label="Prompt"></textarea>
        <button id="send" type="submit">Make</button>
      </form>
      <div id="status" aria-live="polite"></div>
      <div id="recording" hidden><span id="recording-text"></span><button id="recording-cancel" type="button" title="Stop recording; nothing is saved (Esc)">Cancel</button></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
